<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesDesk - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 25px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px #0001;
        }

        h2 {
            color: #173b70;
            text-align: center;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }

        #logoutBtn {
            background: #dc2626;
        }

        #dashboard {
            display: none;
        }

        .section-title {
            text-align: left;
            margin-top: 30px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        #message {
            font-size: 14px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="login">
            <h2>NotesDesk</h2>
            <p>Admin Login</p>

            <form id="loginForm">
                <input type="email" id="email" placeholder="Admin Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="dashboard">

            <h2>Welcome Admin!</h2>
            <p>You are logged in to NotesDesk.</p>

            <h3 class="section-title">Upload New Resource</h3>

            <form id="uploadForm">

                <input type="text" id="title" placeholder="Resource Title" required>

                <textarea id="description" placeholder="Resource Description"></textarea>

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Notes">Notes</option>
                    <option value="Books">Books</option>
                    <option value="Programming">Programming</option>
                    <option value="Videos">Videos</option>
                    <option value="Images">Images</option>
                    <option value="Audio">Audio / Music</option>
                    <option value="Documents">Documents</option>
                    <option value="Other">Other</option>
                </select>
                <input type="file" id="file" multiple required>

                <button type="submit">Upload Resource</button>

            </form>

            <button id="logoutBtn">Logout</button>

        </div>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="admin.js"></script>

</body>

</html>
